[project]
name = "mcp-units"
version = "0.1.0"
description = "MCP server for deterministic unit conversions powered by Pint"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastmcp>=2.14,<3",
    "pint>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pre-commit",
]

[project.scripts]
mcp-units = "mcp_units.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_units"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
